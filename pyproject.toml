[project]
name = "secrets-broker"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32.3",
]

[tool.uv]
dev-dependencies = [
    # testing
    "pytest>=8.3.5",
    "pytest-mock>=3.14.0",
    "pytest-cov>=5.0.0",        # coverage reports
    # formatting
    "black>=24.0.0",
    # linting + style
    "ruff>=0.4.0",              # fast linter (replaces flake8 + isort + pyupgrade)
    # type checking
    "pyright>=1.1.0",
    # complexity
    "radon>=6.0.0",             # cyclomatic + maintainability index
    "xenon>=0.9.0",             # complexity threshold enforcement (wraps radon)
    # PEP conformance
    "pydocstyle>=6.3.0",        # docstring style (PEP 257)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "S",   # flake8-bandit (security)
    "C90", # mccabe complexity
]
ignore = [
    "S101", # assert statements are fine in tests
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
