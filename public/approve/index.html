<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secret Request</title>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f4f4f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .card {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0,0,0,.12);
      padding: 2rem;
      width: 100%;
      max-width: 400px;
    }
    h1 { font-size: 1rem; font-weight: 600; color: #18181b; margin-bottom: .25rem; }
    .sub { font-size: .8rem; color: #71717a; margin-bottom: 1.25rem; }
    .label-pill {
      display: inline-block;
      font-family: ui-monospace, monospace;
      font-size: .9rem;
      background: #f4f4f5;
      border: 1px solid #e4e4e7;
      border-radius: 4px;
      padding: .3rem .6rem;
      margin-bottom: 1.5rem;
    }
    label { display: block; font-size: .8rem; font-weight: 500; color: #3f3f46; margin-bottom: .35rem; }
    input[type=password] {
      width: 100%;
      padding: .55rem .75rem;
      border: 1px solid #d4d4d8;
      border-radius: 6px;
      font-size: .95rem;
      margin-bottom: 1rem;
      outline: none;
      transition: border-color .15s;
    }
    input[type=password]:focus { border-color: #6366f1; }
    .actions { display: flex; gap: .75rem; }
    .btn {
      flex: 1;
      padding: .55rem 1rem;
      border: none;
      border-radius: 6px;
      font-size: .9rem;
      font-weight: 500;
      cursor: pointer;
      transition: opacity .15s;
    }
    .btn:hover { opacity: .88; }
    .btn-approve { background: #6366f1; color: #fff; }
    .btn-deny { background: #f4f4f5; color: #3f3f46; border: 1px solid #e4e4e7; }
    .msg { margin-top: 1rem; font-size: .85rem; padding: .5rem .75rem; border-radius: 6px; display: none; }
    .msg.error { background: #fef2f2; color: #b91c1c; display: block; }
    .msg.success { background: #f0fdf4; color: #15803d; display: block; }
    #login-view { text-align: center; }
    #login-view h1 { margin-bottom: .5rem; }
    #login-view .sub { margin-bottom: 1.5rem; }
    #form-view { display: none; }
  </style>
</head>
<body>
<div class="card">

  <div id="login-view">
    <h1>Authentication required</h1>
    <p class="sub">Sign in to approve or deny this secret request.</p>
    <button class="btn btn-approve" style="width:100%" onclick="netlifyIdentity.open()">Sign in</button>
  </div>

  <div id="form-view">
    <h1>Secret request</h1>
    <p class="sub">A process is requesting access to:</p>
    <span class="label-pill" id="secret-label">loading...</span>
    <label for="secret-input">Secret value</label>
    <input type="password" id="secret-input" placeholder="Paste the secret here..." autocomplete="off">
    <div class="actions">
      <button class="btn btn-approve" onclick="submit('approve')">Approve</button>
      <button class="btn btn-deny" onclick="submit('deny')">Deny</button>
    </div>
    <div class="msg" id="msg"></div>
  </div>

</div>

<script>
  const token = new URLSearchParams(location.search).get("token");

  netlifyIdentity.on("init", user => { if (user) onAuthed(); });
  netlifyIdentity.on("login", () => { netlifyIdentity.close(); onAuthed(); });

  function onAuthed() {
    document.getElementById("login-view").style.display = "none";
    document.getElementById("form-view").style.display = "block";
    loadDetails();
  }

  async function loadDetails() {
    if (!token) { showMsg("No token in URL.", "error"); return; }
    const r = await fetch(`/api/details?token=${token}`);
    if (!r.ok) { showMsg("Request not found or expired.", "error"); return; }
    const d = await r.json();
    document.getElementById("secret-label").textContent = d.label;
  }

  async function submit(action) {
    const user = netlifyIdentity.currentUser();
    if (!user) return;

    const secretValue = document.getElementById("secret-input").value.trim();
    if (action === "approve" && !secretValue) {
      showMsg("Enter a value to approve.", "error");
      return;
    }

    const r = await fetch("/api/submit", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${user.token.access_token}`,
      },
      body: JSON.stringify({ token, action, secret: secretValue }),
    });

    const d = await r.json();
    if (r.ok) {
      showMsg(action === "approve" ? "Approved. The process has been given the secret." : "Denied.", "success");
      document.querySelector(".actions").style.display = "none";
      document.getElementById("secret-input").style.display = "none";
      document.querySelector("label").style.display = "none";
    } else {
      showMsg(d.error || "Something went wrong.", "error");
    }
  }

  function showMsg(text, type) {
    const el = document.getElementById("msg");
    el.textContent = text;
    el.className = `msg ${type}`;
  }
</script>
</body>
</html>
